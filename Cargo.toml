[package]
name = "mdtopdf"
version = "0.2.1"
edition = "2024"
rust-version = "1.92.0"
description = "Convert Markdown to PDF with Typst"
authors = ["<github.com/caybokotze>", "<github.com/pepa65>"]
license = "MIT"
repository = "https://github.com/pepa65/mdtopdf"
readme = "README.md"
keywords = ["markdown", "pdf", "typst", "converter"]
categories = ["command-line-utilities", "text-processing"]

[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
pkg-url = "{repo}/releases/download/{version}/{name}"

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }

# Markdown parsing
pulldown-cmark = "0.13"

# YAML frontmatter parsing
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# PDF generation with Typst
typst = "0.15"
typst-pdf = "0.15"
typst-syntax = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
comemo = "0.5"

# Pattern matching
regex = "1"

# Lazy initialization
once_cell = "1"

# Temp files for mermaid
tempfile = "3"

# Running external commands (mermaid-cli)
which = "8"

# Date/time handling
chrono = "0.4"

# HTTP client for package downloading (using native-tls to avoid ring/clang dependency)
ureq = { version = "3", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
openssl-sys = { version = "0.9", features = ["vendored"] }

# Archive extraction for Typst packages
flate2 = "1"
tar = "0.4"

# Directory utilities
dirs = "7"

[patch.crates-io]
citationberg = { path = "patches/citationberg" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.release-small]
inherits = "release"
opt-level = 's'
