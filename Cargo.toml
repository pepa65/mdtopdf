[package]
name = "md2pdf"
version = "0.1.0"
edition = "2021"
authors = ["md2pdf contributors"]
description = "Convert Markdown to PDF using Typst"
license = "MIT"
repository = "https://github.com/yourusername/md2pdf"
keywords = ["markdown", "pdf", "typst", "converter"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive"] }

# Markdown parsing
pulldown-cmark = "0.10"

# YAML frontmatter parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Syntax highlighting
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# PDF generation with Typst
typst = "0.12"
typst-pdf = "0.12"
typst-syntax = "0.12"
typst-assets = { version = "0.12", features = ["fonts"] }
comemo = "0.4"

# Pattern matching
regex = "1.10"

# Lazy initialization
once_cell = "1.19"

# Temp files for mermaid
tempfile = "3.10"

# Running external commands (mermaid-cli)
which = "6.0"

# Date/time handling
chrono = "0.4"

# HTTP client for package downloading (using native-tls to avoid ring/clang dependency)
ureq = { version = "2.9", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# Archive extraction for Typst packages
flate2 = "1.0"
tar = "0.4"

# Directory utilities
dirs = "5.0"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.release-small]
inherits = "release"
opt-level = 's'
